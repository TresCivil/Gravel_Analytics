<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gravel Ops Analytics</title>
<style>
  :root{
    --navy-950:#0A1830;
    --navy-900:#0E1F3D;
    --navy-800:#16294D;
    --navy-700:#1F3560;
    --ink:#122043;
    --ink-soft:#3B4A6B;
    --muted:#6B7590;
    --line:#E4E7F0;
    --line-soft:#EEF0F6;
    --bg:#F4F5FA;
    --card:#FFFFFF;
    --violet:#6B4E9E;
    --violet-dark:#54397F;
    --violet-mid:#8168B4;
    --violet-tint:#F1ECFA;
    --violet-tint-2:#E7DEF5;
    --amber:#D98C1F;
    --amber-tint:#FBF0DD;
    --green:#25865A;
    --green-tint:#E4F5EC;
    --red:#C24545;
    --red-tint:#FBEAEA;
    --blue-slate:#3B4E7A;
    --blue-slate-tint:#E9EEF7;
    --radius:12px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:"Segoe UI","Segoe UI Semibold",-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;
    background:var(--bg);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;cursor:pointer;}

  /* ===== Layout shell ===== */
  .shell{display:flex; min-height:100vh;}

  /* ===== Sidebar (Figma-style: white panel, grouped sections, icon rows) ===== */
  .sidebar{
    width:250px;
    flex-shrink:0;
    background:#FFFFFF;
    border-right:1px solid var(--line);
    color:var(--ink-soft);
    display:flex;
    flex-direction:column;
    padding:18px 14px 16px;
    position:sticky;
    top:0;
    height:100vh;
    overflow-y:auto;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:10px;
    padding:4px 6px 18px;
    border-bottom:1px solid var(--line);
    margin-bottom:14px;
  }
  .brand-mark{
    width:36px;height:36px;border-radius:9px;
    background:linear-gradient(145deg, var(--violet-mid), var(--violet-dark));
    display:flex;align-items:center;justify-content:center;
    font-weight:700;font-size:14px;color:#fff;
    letter-spacing:0.2px;
    flex-shrink:0;
    box-shadow:0 2px 8px rgba(107,78,158,0.28);
  }
  .brand-text{line-height:1.15;}
  .brand-title{font-size:15px;font-weight:600;color:var(--ink);letter-spacing:0.1px;}
  .brand-sub{font-size:10.5px;color:var(--muted);margin-top:2px;}

  .nav-group{margin-bottom:4px;}
  .nav-label{
    font-size:10px;
    letter-spacing:0.09em;
    color:#9AA3BC;
    font-weight:600;
    text-transform:uppercase;
    padding:12px 10px 5px;
  }
  .nav-item{
    display:flex;align-items:center;gap:9px;
    padding:8px 10px;
    border-radius:7px;
    font-size:13px;
    font-weight:700;
    color:var(--ink-soft);
    margin:1px 0;
    cursor:pointer;
    user-select:none;
    transition:background .12s;
  }
  .nav-item svg{width:15px;height:15px;flex-shrink:0;opacity:0.75;}
  .nav-item:hover{background:var(--line-soft);}
  .nav-item.active{
    background:var(--violet-tint);
    color:var(--violet-dark);
    font-weight:700;
    box-shadow:inset 3px 0 0 var(--violet);
  }
  .nav-item.active svg{opacity:1;color:var(--violet-dark);}
  .nav-badge{
    margin-left:auto;
    background:var(--amber);
    color:#2A1B00;
    font-size:9.5px;
    font-weight:700;
    padding:1px 6px;
    border-radius:20px;
  }

  .sidebar-spacer{flex:1;}

  .sidebar-footer{
    border-top:1px solid var(--line);
    padding-top:13px;
    margin-top:8px;
  }
  .footer-logo{
    display:flex;align-items:center;justify-content:center;
    padding:9px 10px;
  }
  .footer-logo img{display:block;height:16px;width:auto;}
  .footer-caption{
    font-size:9.5px;color:var(--muted);text-align:center;margin-top:2px;letter-spacing:0.02em;
  }

  /* ===== Main ===== */
  .main{flex:1;min-width:0;padding:26px 36px 60px;max-width:1580px;}
  .screen{display:none;}
  .screen.active{display:block;}

  .topbar{
    display:flex;align-items:flex-start;justify-content:space-between;
    margin-bottom:22px;
    gap:24px;
  }
  .topbar h1{font-size:22px;margin:0 0 4px;font-weight:600;color:var(--ink);}
  .topbar .subtitle{font-size:13px;color:var(--muted);}

  .topbar-actions{display:flex;align-items:center;gap:10px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end;}
  .search{
    display:flex;align-items:center;gap:7px;
    background:var(--card);border:1px solid var(--line);border-radius:8px;
    padding:8px 12px;font-size:13px;color:var(--muted);
    width:200px;
  }
  .search svg{width:14px;height:14px;opacity:0.6;flex-shrink:0;}
  .pill-btn{
    display:flex;align-items:center;gap:6px;
    background:var(--card);border:1px solid var(--line);border-radius:8px;
    padding:8px 13px;font-size:13px;color:var(--ink-soft);font-weight:500;
    white-space:nowrap;
  }
  .pill-btn:hover{border-color:#CBD1E3;}
  .pill-btn.active{background:var(--violet-tint);border-color:var(--violet-mid);color:var(--violet-dark);}
  .pill-btn svg{width:14px;height:14px;}
  .btn-primary{
    display:flex;align-items:center;gap:7px;
    background:var(--violet);color:#fff;border:none;border-radius:8px;
    padding:9px 15px;font-size:13px;font-weight:600;
    box-shadow:0 2px 6px rgba(107,78,158,0.32);
    white-space:nowrap;
  }
  .btn-primary:hover{background:var(--violet-dark);}
  .btn-primary svg{width:14px;height:14px;}
  .btn-ghost{
    background:transparent;border:1px solid var(--line);border-radius:8px;
    padding:9px 15px;font-size:13px;font-weight:600;color:var(--ink-soft);
  }

  /* ===== KPI row ===== */
  .kpi-row{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:16px;
    margin-bottom:22px;
  }
  .kpi-row.four{grid-template-columns:repeat(4,1fr);}
  .kpi-card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:16px 17px 15px;
  }
  .kpi-card.clickable{cursor:pointer;transition:box-shadow .15s, transform .15s;}
  .kpi-card.clickable:hover{box-shadow:0 6px 16px rgba(18,32,67,0.08);transform:translateY(-1px);}
  .kpi-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .kpi-label{font-size:11.5px;color:var(--muted);font-weight:600;letter-spacing:0.02em;text-transform:uppercase;}
  .kpi-icon{
    width:26px;height:26px;border-radius:7px;
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
  }
  .kpi-icon svg{width:14px;height:14px;}
  .kpi-icon.v{background:var(--violet-tint);color:var(--violet-dark);}
  .kpi-icon.g{background:var(--green-tint);color:var(--green);}
  .kpi-icon.a{background:var(--amber-tint);color:var(--amber);}
  .kpi-icon.b{background:var(--blue-slate-tint);color:var(--blue-slate);}
  .kpi-value{font-size:24px;font-weight:700;color:var(--ink);letter-spacing:-0.01em;}
  .kpi-unit{font-size:13px;font-weight:500;color:var(--muted);margin-left:3px;}
  .kpi-delta{font-size:11.5px;margin-top:6px;color:var(--muted);}
  .kpi-delta.up{color:var(--green);}
  .kpi-delta.warn{color:var(--amber);}

  /* ===== Panels ===== */
  .panel{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:18px 20px 20px;
  }
  .panel-head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:14px;gap:12px;flex-wrap:wrap;}
  .panel-title{font-size:14.5px;font-weight:600;color:var(--ink);}
  .panel-sub{font-size:11.5px;color:var(--muted);margin-top:2px;}
  .panel-tabs{display:flex;gap:4px;background:var(--line-soft);border-radius:7px;padding:3px;}
  .panel-tab{font-size:11.5px;padding:5px 10px;border-radius:5px;color:var(--muted);font-weight:600;border:none;background:transparent;}
  .panel-tab.active{background:#fff;color:var(--violet-dark);box-shadow:0 1px 2px rgba(0,0,0,0.06);}

  .charts-row{display:grid;grid-template-columns:1.55fr 1fr;gap:16px;margin-bottom:16px;}
  .midrow{display:grid;grid-template-columns:1fr 1.55fr;gap:16px;margin-bottom:16px;}
  .bottom-row{display:grid;grid-template-columns:1.15fr 0.85fr;gap:16px;}
  .stack{display:flex;flex-direction:column;gap:16px;}

  .legend{display:flex;gap:16px;margin-top:12px;flex-wrap:wrap;}
  .legend-item{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-soft);}
  .legend-dot{width:8px;height:8px;border-radius:2px;flex-shrink:0;}

  .donut-wrap{display:flex;align-items:center;gap:18px;}

  .bar-row{display:flex;align-items:center;gap:10px;margin-bottom:11px;}
  .bar-row:last-child{margin-bottom:0;}
  .bar-label{width:118px;font-size:12px;color:var(--ink-soft);flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .bar-track{flex:1;height:9px;background:var(--line-soft);border-radius:5px;overflow:hidden;}
  .bar-fill{height:100%;border-radius:5px;background:linear-gradient(90deg,var(--violet-mid),var(--violet));}
  .bar-value{width:56px;text-align:right;font-size:12px;font-weight:600;color:var(--ink);flex-shrink:0;}

  /* ===== Table ===== */
  .table-scroll{overflow-x:auto;}
  table{width:100%;border-collapse:collapse;}
  th{
    text-align:left;font-size:10.5px;letter-spacing:0.04em;text-transform:uppercase;
    color:var(--muted);font-weight:600;padding:0 10px 9px;border-bottom:1px solid var(--line);
    white-space:nowrap;
  }
  td{
    padding:11px 10px;font-size:12.5px;color:var(--ink-soft);border-bottom:1px solid var(--line-soft);
    vertical-align:middle;
  }
  tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:#FAFAFD;}
  .testing-pit-row{cursor:pointer;}
  .testing-pit-row.row-selected{background:var(--violet-tint);}
  .cell-strong{color:var(--ink);font-weight:600;}
  .cell-muted{color:var(--muted);}
  .pit-cell{display:flex;align-items:center;gap:8px;}
  .pit-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
  .gauge{display:flex;align-items:center;gap:8px;}
  .gauge-track{width:84px;height:7px;background:var(--line-soft);border-radius:4px;overflow:hidden;flex-shrink:0;}
  .gauge-fill{height:100%;border-radius:4px;}
  .gauge-pct{font-size:11.5px;font-weight:600;color:var(--ink-soft);width:36px;flex-shrink:0;}

  .status-pill{
    display:inline-flex;align-items:center;gap:5px;
    font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;
    white-space:nowrap;
  }
  .status-pill.open{background:var(--green-tint);color:var(--green);}
  .status-pill.closed{background:#EEF0F6;color:var(--muted);}
  .status-pill.tbc{background:var(--amber-tint);color:var(--amber);}
  .status-pill.active-p{background:var(--violet-tint);color:var(--violet-dark);}
  .status-pill.fail{background:var(--red-tint);color:var(--red);}
  .status-pill.pending{background:var(--amber-tint);color:var(--amber);}
  .status-pill::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor;}

  .method-pill{
    display:inline-flex;align-items:center;gap:5px;
    font-size:10.5px;font-weight:600;padding:3px 8px;border-radius:6px;
    white-space:nowrap;
  }
  .method-pill.mobile{background:var(--violet-tint);color:var(--violet-dark);}
  .method-pill.desktop{background:var(--blue-slate-tint);color:var(--blue-slate);}

  .type-pill{
    display:inline-flex;align-items:center;
    font-size:10.5px;font-weight:600;padding:3px 8px;border-radius:6px;
    background:var(--line-soft);color:var(--ink-soft);
    white-space:nowrap;
  }
  .cat-pill{
    display:inline-flex;align-items:center;
    font-size:10.5px;font-weight:600;padding:3px 8px;border-radius:6px;
    white-space:nowrap;
  }
  .cat-pill.private{background:var(--violet-tint);color:var(--violet-dark);}
  .cat-pill.nbrc{background:var(--green-tint);color:var(--green);}
  .cat-pill.state{background:var(--blue-slate-tint);color:var(--blue-slate);}
  .cat-pill.tmr{background:var(--amber-tint);color:var(--amber);}
  .cat-pill.comm{background:#EEF0F6;color:var(--muted);}

  .link-icon{display:inline-flex;align-items:center;gap:5px;color:var(--violet-dark);font-weight:600;font-size:12px;}
  .link-icon svg{width:13px;height:13px;}

  .activity-row{display:flex;gap:12px;padding:11px 2px;border-bottom:1px solid var(--line-soft);}
  .activity-row:last-child{border-bottom:none;}
  .activity-icon{
    width:30px;height:30px;border-radius:8px;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
  }
  .activity-icon svg{width:14px;height:14px;}
  .activity-icon.prod{background:var(--violet-tint);color:var(--violet-dark);}
  .activity-icon.haul{background:var(--blue-slate-tint);color:var(--blue-slate);}
  .activity-icon.crit{background:var(--red-tint);color:var(--red);}
  .activity-icon.warn{background:var(--amber-tint);color:var(--amber);}
  .attention-badge{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--red);color:#fff;font-size:11px;font-weight:700;margin-left:8px;}
  .activity-body{flex:1;min-width:0;}
  .activity-title{font-size:12.5px;font-weight:600;color:var(--ink);}
  .activity-meta{font-size:11.5px;color:var(--muted);margin-top:2px;}
  .activity-time{font-size:11px;color:var(--muted);white-space:nowrap;flex-shrink:0;}

  /* ===== Attachments: folder list ===== */
  .folder-row{display:flex;align-items:center;gap:10px;padding:11px 6px;border-radius:8px;cursor:pointer;border-bottom:1px solid var(--line-soft);}
  .folder-row:last-child{border-bottom:none;}
  .folder-row:hover{background:var(--line-soft);}
  .folder-row.folder-row-active{background:var(--violet-tint);}
  .folder-row-icon{width:30px;height:30px;border-radius:8px;background:var(--blue-slate-tint);color:var(--blue-slate);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .folder-row-icon svg{width:15px;height:15px;}
  .folder-row.folder-row-active .folder-row-icon{background:var(--violet-tint-2);color:var(--violet-dark);}
  .folder-row-text{flex:1;min-width:0;}
  .folder-row-name{font-size:12.5px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .folder-row-count{font-size:11px;color:var(--muted);margin-top:1px;}
  .folder-row-link{width:14px;height:14px;color:var(--muted);flex-shrink:0;cursor:pointer;}
  .folder-row-link:hover{color:var(--violet-dark);}

  /* ===== Pit Map ===== */
  .map-layout{display:grid;grid-template-columns:1.7fr 1fr;gap:16px;align-items:start;}
  .map-wrap{
    position:relative;border-radius:var(--radius);overflow:hidden;
    background:linear-gradient(160deg,#EAF3EC 0%, #E3EFE6 100%);
    border:1px solid var(--line);
  }
  .map-wrap svg{display:block;width:100%;height:auto;}
  .map-caption{
    position:absolute;left:14px;bottom:12px;font-size:10.5px;color:#6B8778;
    background:rgba(255,255,255,0.75);padding:3px 9px;border-radius:20px;
  }
  .map-compass{position:absolute;top:14px;right:16px;font-size:11px;font-weight:700;color:#5E7C6B;
    width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,0.8);
    display:flex;align-items:center;justify-content:center;border:1px solid rgba(94,124,107,0.25);}
  .pit-marker{cursor:pointer;transform-box:fill-box;transform-origin:center;transition:transform .12s;}
  .pit-marker:hover{transform:scale(1.35);}
  .pit-marker.selected{transform:scale(1.5);}
  .town-label{font-size:11.5px;font-weight:700;fill:#4A5C6B;font-family:"Segoe UI",sans-serif;
    paint-order:stroke;stroke:#EAF3EC;stroke-width:5px;stroke-linejoin:round;text-anchor:middle;}
  .town-dot{fill:#8FA6B3;}
  .map-legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px;}
  .map-legend-item{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-soft);}
  .map-legend-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}

  .pit-list-item{
    display:flex;align-items:center;gap:10px;padding:10px 8px;border-radius:8px;
    cursor:pointer;border-bottom:1px solid var(--line-soft);
  }
  .pit-list-item:last-child{border-bottom:none;}
  .pit-list-item:hover{background:var(--line-soft);}
  .pit-list-item.active{background:var(--violet-tint);}
  .pit-list-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
  .pit-list-text{flex:1;min-width:0;}
  .pit-list-name{font-size:12.5px;font-weight:600;color:var(--ink);}
  .pit-list-meta{font-size:11px;color:var(--muted);margin-top:1px;}
  .pit-list-chevron{width:14px;height:14px;color:var(--muted);flex-shrink:0;}

  .detail-empty{
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:40px 20px;color:var(--muted);
  }
  .detail-empty svg{width:34px;height:34px;margin-bottom:10px;opacity:0.5;}
  .detail-empty-title{font-size:13px;font-weight:600;color:var(--ink-soft);margin-bottom:4px;}
  .detail-empty-sub{font-size:11.5px;max-width:220px;}
  .detail-back{
    display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;
    color:var(--muted);cursor:pointer;margin-bottom:10px;
  }
  .detail-back:hover{color:var(--violet-dark);}
  .detail-back svg{width:13px;height:13px;}
  .detail-actions{display:flex;flex-direction:column;gap:8px;margin-top:14px;}
  .detail-action-btn{
    display:flex;align-items:center;justify-content:center;gap:7px;
    padding:9px 12px;border-radius:8px;font-size:12.5px;font-weight:600;
    border:1px solid var(--line);color:var(--ink-soft);background:#fff;cursor:pointer;
  }
  .detail-action-btn:hover{border-color:var(--violet-mid);color:var(--violet-dark);}
  .detail-action-btn svg{width:14px;height:14px;}

  /* ===== Filter chips ===== */
  .chip-row{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;}
  .filter-chip{
    background:var(--card);border:1px solid var(--line);border-radius:20px;
    padding:7px 14px;font-size:12px;font-weight:600;color:var(--ink-soft);
  }
  .filter-chip.active{background:var(--violet);border-color:var(--violet);color:#fff;}

  /* ===== Form ===== */
  .form-panel{margin-bottom:16px;}
  .form-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:14px;}
  .form-field{display:flex;flex-direction:column;gap:6px;}
  .form-field label{font-size:11px;font-weight:600;color:var(--ink-soft);text-transform:uppercase;letter-spacing:0.02em;}
  .form-field input, .form-field select{
    border:1px solid var(--line);border-radius:8px;padding:9px 11px;font-size:13px;
    font-family:inherit;color:var(--ink);background:#fff;
  }
  .form-field input::placeholder{color:#AEB4C6;}
  .form-field.auto input{background:var(--line-soft);color:var(--muted);}
  .form-field .hint{font-size:10.5px;color:var(--muted);margin-top:-2px;}
  .upload-box{
    border:1.5px dashed var(--line);border-radius:8px;padding:14px;text-align:center;
    font-size:12px;color:var(--muted);cursor:pointer;
  }
  .upload-box:hover{border-color:var(--violet-mid);color:var(--violet-dark);}
  .upload-box svg{width:18px;height:18px;display:block;margin:0 auto 6px;}
  .form-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:4px;}

  /* ===== Toggle switch ===== */
  .toggle-row{display:flex;align-items:center;justify-content:space-between;padding:13px 2px;border-bottom:1px solid var(--line-soft);}
  .toggle-row:last-child{border-bottom:none;}
  .toggle-text .t-title{font-size:13px;font-weight:600;color:var(--ink);}
  .toggle-text .t-sub{font-size:11.5px;color:var(--muted);margin-top:2px;}

    const now = new Date();
    S.TODAY = isoOf(P.today) || (now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0') + '-' + String(now.getDate()).padStart(2, '0'));

    const ym = v => { const i = isoOf(v); return i ? { y:parseInt(i.slice(0, 4), 10), m:parseInt(i.slice(5, 7), 10) } : null; };

    if (Array.isArray(P.roads)) P.roads.forEach(e => { const k = ym(e.m || e.d); const t = num(e.t); if (k && t) S.ROADS.push({ road:str(e.r) || 'Not recorded', pit:e.p != null ? str(e.p) : null, y:k.y, m:k.m, t:t, n:num(e.n) }); });

    const asked = String(P.years != null && P.years !== '' ? P.years : (P.year != null ? P.year : '')).split(/[,;\s]+/).map(Number).filter(y => y >= 1990 && y <= 2100 && !(P.allTime === true || String(P.allTime).toLowerCase() === 'true'));

    S.YEARS.forEach(y => { S.PMT[y] = new Array(12).fill(0); S.HMT[y] = new Array(12).fill(0); });

    /* open = starting stock (e.g. Best Available Stock Estimate): stockpile = open + crushed - hauled */
    S.pits.forEach(p => { if (p.open != null) { S.OFF[p.id] = p.open; S.OFFT += p.open; } });
    S.pits.forEach(p => { if (p.open != null || p.stock == null) return; const calc = sum(S.CRUSH.filter(e => e.pit === p.id).map(e => e.t)) - sum(S.HAUL.filter(e => e.pit === p.id).map(e => e.t)); S.OFF[p.id] = p.stock - calc; S.OFFT += S.OFF[p.id]; });

    /* tidy material and status text so "150 minus" / "150 Minus" or "In Progress" / "In progress" match */
    const matLabels = {};
    const normMat = v => { const t = str(v).replace(/\s+/g, ' '); if (!t) return ''; const k = t.toLowerCase(); const known = MATS.find(m => m.toLowerCase() === k); return matLabels[k] || (matLabels[k] = known || t); };

    })) : null;

    S.overRule = P.overRule || (S.demo ? 'stock' : 'hauled');
    S.bstock = Array.isArray(P.bstock) ? P.bstock.map(x => ({ pit:str(x.p), mat:str(x.mat), t:num(x.t) || 0 })) : null;

  const prodM = (y, id) => { const a = new Array(12).fill(0); S.CRUSH.forEach(e => { if (e.y === y && (!id || e.pit === id)) a[e.m - 1] += e.t; }); return a; };

  const loadsOf = t => Math.round(t / 24.6);
  const loadsWhere = f => { const rows = (S.ROADS.length ? S.ROADS : S.HAUL).filter(f); return S.hasLoads ? Math.round(sum(rows.map(e => (e.n != null ? e.n : e.t / 24.6)))) : loadsOf(sum(rows.map(e => e.t))); };
  const limitAll = () => sum(S.pits.map(p => p.limit || 0));
  const activeRows = () => S.pits.filter(p => p.status !== 'Not started');
  const pctOf = (v, lim) => (lim ? Math.round(v / lim * 100) : null);
  const elapsedPct = y => (y < S.CUR ? 100 : Math.round((D(S.TODAY) - D(S.CUR + '-01-01') + 1) / 365 * 100));
  const delta = (a, b) => (b > 0 ? Math.round((a - b) / b * 100) : null);

  /* ---------- bookings: first booked, first reserved ---------- */
  const isOpen = b => b.status === 'Confirmed' || b.status === 'In progress';
  const bal = b => (isOpen(b) ? Math.max(0, b.t - b.del) : 0);
  function stockFor(pit, mat) {
    if (S.bstock) { const s = S.bstock.find(x => x.pit === pit && x.mat === mat); return s ? s.t : 0; }

    const list = S.bookings.filter(b => b.pit === pit && (pooled || b.mat === mat) && isOpen(b))
      .sort((a, b) => D(a.on) - D(b.on) || String(a.id).localeCompare(String(b.id)));

    });

  }
  function pitBarHtml(pit, pct, limit, color) {

    let ovr = Math.min(100 - used, t.over / lim * 100); if (t.over > 0 && 100 - used > 0) ovr = Math.max(ovr, Math.min(100 - used, 3));
    const tip = (pct == null ? 'Not started. ' : 'Used ' + pct + '% of the extraction limit. ') + 'Reserved by open bookings: ' + fmtN(t.reserved) + ' t from stockpile' + (t.over > 0 ? ', plus ' + fmtN(t.over) + ' t not yet produced' : '') + '.';
    return '<div class="gauge" data-tip="' + esc(tip) + '"><div class="gauge-track"><div class="gauge-fill" style="width:' + used + '%;background:' + color + ';position:relative;">' + (res > 0 ? '<i class="bk-rsv" style="width:' + (res / used * 100) + '%"></i>' : '') + '</div>' + (ovr > 0 ? '<i class="bk-ovr" style="left:' + used + '%;width:' + ovr + '%"></i>' : '') + '</div><span class="gauge-pct">' + (pct == null ? '-' : pct + '%') + '</span></div>';
  }

  /* ---------- capacity rule: tonnes crushed this calendar year as a share of the extraction limit ---------- */
  const capCol = pct => (pct > 100 ? C.r : (pct >= 95 ? C.g : C.a));

    h += '<div class="g2"><div class="panel"><div class="panel-head"><div><div class="panel-title">Production by month' + (fp ? ' · ' + esc(fp.name) : '') + '</div><div class="panel-sub">Tonnes crushed per month' + (single ? ', ' + ys[0] : ', years side by side') + '</div></div></div>' +
      (anyProd ? colChart(MON, ys.map(y => ({ name:String(y), color:YCOL[y], vals:pmF(y).map((v, i) => (i < monthsAvail(y) ? v : null)) })), { h:250, tipCat:i => MONTH_FULL[i], sel:mSel, f:i => 'm:' + (i + 1) }) : noDataBox(selLabel)) + legend(ys.map(y => [String(y), YCOL[y]])) + '</div>' +
      '<div class="panel"><div class="panel-head"><div><div class="panel-title">Cumulative production by year' + (fp ? ' · ' + esc(fp.name) : '') + '</div><div class="panel-sub">Running total through the year against the limit for ' + (fp ? 'this pit' : 'all open pits') + '</div></div></div>' +
      (anyProd ? lineChart(MON, ys.map(y => ({ name:String(y), color:YCOL[y], w:3, vals:cumOf(pmF(y), monthsAvail(y)) })), { h:250, tipCat:i => 'To the end of ' + MONTH_FULL[i], sel:mSel, f:i => 'm:' + (i + 1), hline:lim ? { v:lim, label:(fp ? 'Limit for ' + fp.name + ' ' : 'Limit for all open pits ') + fmtN(lim) + ' t' } : null }) : noDataBox(selLabel)) + legend(ys.map(y => [String(y), YCOL[y]])) +
      '<div class="v9-note">' + (fp ? esc(fp.name) + (fp.limit ? ' has a ' + fmtN(fp.limit) + ' t limit a year.' : ' has no limit set.') : 'All ' + R.filter(p => p.limit).length + ' open pits with a limit add up to ' + fmtN(limAll) + ' t a year.') + ' Pit limits are assumed to be the same in every year.</div></div></div>';

    /* continuous crushed, hauled, stockpile timeline (click a point) */
    const trend = sk.length > 3 ? (sk[upto - 1] || 0) - (sk[Math.max(0, upto - 4)] || 0) : null, many = tl.length > 14;
    h += '<div class="panel" style="margin-bottom:16px;"><div class="panel-head"><div><div class="panel-title">Crushed, hauled and stockpile' + (fp ? ' · ' + esc(fp.name) : '') + '</div><div class="panel-sub">One continuous timeline for the selected years. The stockpile is ' + (S.OFFT ? 'the starting stock plus everything crushed, less everything hauled' : 'everything crushed less everything hauled') + ', so it carries over from month to month.' + (F.road ? ' Hauled shows ' + esc(F.road) + ' only.' : '') + '</div></div></div>' +
      '<div class="mini-row"><div><b>' + fmtN(stockEnd) + ' t</b><span>stockpile ' + stockLab + (stockEnd < 0 ? '<em style="display:block;font-style:normal;font-weight:600;font-size:11.5px;color:' + C.r + ';margin-top:2px;">Below zero: more hauled than crushed in the logs</em>' : '') + '</span></div><div><b>' + (cover ? cover.toFixed(1) : '-') + '</b><span>months of cover at the last 3 months of haulage</span></div><div><b style="color:' + (trend != null && trend > 0 ? C.a : C.g) + ';">' + (trend == null ? '-' : (trend > 0 ? '+' : '') + fmtN(trend) + ' t') + '</b><span>' + (trend != null && trend > 0 ? 'rising over 3 months: crushing is ahead of haulage' : 'change over 3 months') + '</span></div></div>' +
      (anyTl ? lineChart(tl.map(p => mLab(p.y, p.m)), [{ name:'Crushed', color:C.v, vals:cr }, { name:'Hauled', color:C.b, vals:hl }, { name:'Stockpile at month end', color:C.a, dash:true, vals:sk }], { w:1000, h:270, labelEvery:many ? 3 : 1, nodots:many, tipCat:i => MONTH_FULL[tl[i].m - 1] + ' ' + tl[i].y, sel:selIdx >= 0 ? selIdx : null, f:i => 'ym:' + tl[i].y + '-' + tl[i].m }) : noDataBox(selLabel)) +
      legend([['Crushed', C.v], ['Hauled', C.b], ['Stockpile at month end', C.a]]) + '</div>';

    /* where the material sits (stock at the selected month end) and crushed by pit (click a pit) */
    const sy0 = F.m ? (F.y || last) : last, sy = Math.min(sy0, S.CUR), sm = F.m && sy0 <= S.CUR ? F.m : (sy === S.CUR ? S.CURM : 12);
    const sitting = R.map(p => ({ p:p, t:stockAtPM(p.id, sy, sm) })).filter(x => x.t > 0).sort((a, b) => b.t - a.t);
    const byPit = R.map(p => ({ p:p, segs:ys.map(y => ({ name:String(y), color:YCOL[y], v:inYear(prodM(y, p.id), y) })) })).map(x => { x.total = sum(x.segs.map(s => s.v)); return x; }).filter(x => x.total > 0).sort((a, b) => b.total - a.total);
    h += '<div class="g2"><div class="panel"><div class="panel-head"><div><div class="panel-title">Where the material sits</div><div class="panel-sub">Stockpile by pit ' + (F.m ? 'at end of ' + MON[sm - 1] + ' ' + sy : stockLab) + ': crushed and not yet hauled · ' + sitting.length + ' pits</div></div></div>' +
      (sitting.length ? '<div class="scrollbox">' + sitting.map(x => fbar(x.p.name, x.t, sitting[0].t, C.a, fmtN(x.t) + ' t', x.p.name + '|Stockpile ' + fmtN(x.t) + ' t', 'pit:' + x.p.id, pitState(x.p.id))).join('') + '</div>' : '<div class="cell-muted" style="padding:8px 0;">No stockpile.</div>') + '</div>' +
      '<div class="panel"><div class="panel-head"><div><div class="panel-title">Crushed by pit</div><div class="panel-sub">' + byPit.length + ' pits, ' + (more ? 'latest 4 selected years' : 'selected years') + ' stacked' + (F.m ? ' · ' + monthLabel() + ' only' : '') + '</div></div></div>' +
      (byPit.length ? '<div class="scrollbox">' + byPit.map(x => stackRow(x.p.name, x.segs, byPit[0].total, x.total, 'pit:' + x.p.id, pitState(x.p.id))).join('') + '</div>' : '<div class="cell-muted" style="padding:8px 0;">No crushing in this selection.</div>') + legend(ys.map(y => [String(y), YCOL[y]])) + '</div></div>';

    /* year on year, years as rows (follows pit, road and month filters) */
    const yy = S.YEARS.map(a => {
      const n = Math.min(cut, monthsAvail(a)), pAll = pmF(a), hAll = hmF(a);
      const idx = F.m ? (F.m <= monthsAvail(a) ? [F.m - 1] : []) : Array.from({ length:n }, (_, i) => i);
      const p = idx.map(i => pAll[i]), hh = idx.map(i => hAll[i]), pk = p.indexOf(Math.max.apply(null, [0].concat(p)));
      const pits = new Set(S.CRUSH.filter(e => e.y === a && idx.indexOf(e.m - 1) >= 0 && (!F.pit || e.pit === F.pit)).map(e => e.pit)).size;
      const endM = F.m ? F.m : n;
      return { y:a, prod:sum(p), haul:sum(hh), loads:loadsF(e => e.y === a && idx.indexOf(e.m - 1) >= 0), pits:pits, avg:pits ? Math.round(sum(p) / pits) : 0,
               peak:sum(p) ? MON[idx[pk]] + ' ' + fmtN(p[pk]) + ' t' : '-', stock:(SS[a] && SS[a][endM - 1]) || 0, share:lim ? pctOf(sum(p), lim) + '%' : '–' };
    });
    h += '<div class="panel" style="margin-bottom:16px;"><div class="panel-head"><div><div class="panel-title">Year on year' + (fp ? ' · ' + esc(fp.name) : '') + '</div><div class="panel-sub">One row per calendar year' + (F.m ? ', ' + MONTH_FULL[F.m - 1] + ' only' : (LFL ? ', January to ' + MONTH_FULL[cut - 1] + ' of each year' : '')) + (F.road ? ' · hauled' + (S.hasLoads ? ' and loads' : '') + ' for ' + esc(F.road) : '') + '. Selected years are highlighted.</div></div></div><div class="table-scroll scrollbox"><table><thead><tr><th>Year</th><th>Crushed (t)</th><th>Hauled (t)</th>' + (S.hasLoads ? '<th>Loads</th>' : '') + '<th>Pits producing</th><th>Average per producing pit (t)</th><th>Peak month</th><th>Stockpile at end (t)</th><th>Share of ' + (fp ? 'pit' : 'annual') + ' limit</th></tr></thead><tbody>' +
      yy.map(r => '<tr' + (YSEL.indexOf(r.y) >= 0 ? ' class="sel-row"' : '') + '><td class="cell-strong">' + r.y + (r.y === S.CUR && !LFL && !F.m ? ' to date' : '') + '</td><td>' + fmtN(r.prod) + '</td><td>' + fmtN(r.haul) + '</td>' + (S.hasLoads ? '<td>' + fmtN(r.loads) + '</td>' : '') + '<td>' + r.pits + '</td><td>' + fmtN(r.avg) + '</td><td>' + r.peak + '</td><td>' + fmtN(r.stock) + '</td><td>' + r.share + '</td></tr>').join('') +
      '</tbody></table></div><div class="v9-note">' + S.CUR + ' is year to date.</div></div>';

    /* roads (click a road) and bookings */
    const pitBlocked = F.pit && !roadsHavePit();
    const rg = {}; S.ROADS.filter(e => ys.indexOf(e.y) >= 0 && inMonthF(e) && (!F.pit || pitBlocked || e.pit === F.pit)).forEach(e => { rg[e.road] = (rg[e.road] || 0) + e.t; });
    const roads = Object.keys(rg).map(k => ({ k:k, t:rg[k], n:(S.hasLoads ? Math.round(sum(S.ROADS.filter(e => e.road === k && ys.indexOf(e.y) >= 0 && inMonthF(e) && (!F.pit || pitBlocked || e.pit === F.pit)).map(e => (e.n != null ? e.n : e.t / 24.6)))) : Math.round(rg[k] / 24.6)) })).sort((a, b) => b.t - a.t), totR = sum(roads.map(r => r.t));
    const pRoads = '<div class="panel"><div class="panel-head"><div><div class="panel-title">Roads by gravel hauled</div><div class="panel-sub">' + (F.m ? monthLabel() : 'Selected years combined') + ' · ' + roads.length + ' roads · ' + fmtN(totR) + ' t in total</div></div></div>' +
      (pitBlocked ? '<div class="fnote">Showing all pits: road haulage isn\'t split by pit in the data sent.</div>' : '') +
      (roads.length ? '<div class="scrollbox">' + roads.map((r, i) => fbar(r.k, r.t, roads[0].t, C.b, fmtN(r.t) + ' t' + (S.hasLoads ? ' · ' + fmtN(r.n) + ' loads' : ''), r.k + '|' + fmtN(r.t) + ' t' + (S.hasLoads ? ' · ' + fmtN(r.n) + ' loads' : ''), 'road:' + r.k, roadState(r.k))).join('') + '</div>' : '<div class="cell-muted" style="padding:8px 0;">No haulage in this selection.</div>') + '</div>';
    if (B) {
      const bks = F.pit ? B.BOOKINGS.filter(b => b.pit === F.pit) : B.BOOKINGS, st = s => bks.filter(b => b.status === s), openB = bks.filter(isOpen);
      const booked = sum(bks.filter(b => b.status !== 'Cancelled').map(b => b.t)), deliv = sum(bks.filter(b => b.status !== 'Cancelled').map(b => b.del));
      const byMat = m => sum(bks.filter(b => b.mat === m && b.status !== 'Cancelled').map(b => b.t));
      /* only materials that appear in the bookings, known ones first */
      const present = Array.from(new Set(B.BOOKINGS.map(b => b.mat).filter(Boolean)));
      const mats = MATS.filter(m => present.indexOf(m) >= 0).concat(present.filter(m => MATS.indexOf(m) < 0));
      const known = ['In progress', 'Confirmed', 'Completed', 'Cancelled'], odd = {};
      B.BOOKINGS.forEach(b => { if (known.indexOf(b.status) < 0) odd[b.status || '(blank)'] = (odd[b.status || '(blank)'] || 0) + 1; });
      const oddNote = Object.keys(odd).length ? '<div class="fnote">Status not recognised: ' + Object.keys(odd).map(k => esc(k) + ' (' + odd[k] + ')').join(', ') + '. Expected In progress, Confirmed or Cancelled (check the Status column sends text, not a number).</div>' : '';
      const overAll = Object.keys(B.PITS).map(id => ({ id:id, t:pitTotals(id) })).filter(x => x.t.over > 0).sort((a, b) => b.t.over - a.t.over);
      const overSel = F.pit ? overAll.filter(x => x.id === F.pit) : overAll;
      h += '<div class="g2">' + pRoads +
        '<div class="panel"><div class="panel-head"><div><div class="panel-title">Bookings' + (fp ? ' · ' + esc(fp.name) : '') + '</div><div class="panel-sub">Live position. Not filtered by year or month.</div></div></div>' +
        '<div class="mini-row"><div><b>' + st('In progress').length + '</b><span>in progress</span></div><div><b>' + st('Confirmed').length + '</b><span>confirmed</span></div><div><b>' + st('Cancelled').length + '</b><span>cancelled</span></div><div><b style="color:' + (overSel.length ? C.r : 'var(--ink)') + ';">' + fmtN(sum(overSel.map(x => x.t.over))) + ' t</b><span>over-allocated</span></div></div>' + oddNote +
        '<div class="sub-head">Booked and delivered</div>' + fbar('Delivered of booked', deliv, booked, C.g, fmtN(deliv) + ' of ' + fmtN(booked) + ' t') +
        mats.map((m, i) => fbar(m, byMat(m), booked, i === 0 ? C.v : C.b, fmtN(byMat(m)) + ' t')).join('') +
        (overAll.length ? '<div class="sub-head">Over-allocated by pit</div>' + overAll.map(x => fbar(pitOf(x.id).name, x.t.over, overAll[0].t.over, C.r, fmtN(x.t.over) + ' t', pitOf(x.id).name + '|' + fmtN(x.t.over) + ' t ' + G.overLabel(), 'pit:' + x.id, pitState(x.id))).join('') : '<div class="v9-sub" style="padding-top:8px;">Every open booking is covered.</div>') + '</div></div>';
    } else {
      h += '<div class="g2 one">' + pRoads + '</div>';
    }

    /* royalties (click a pit) */
    if (S.royalty && !S.royaltyAmounts && sum(allRows.map(r => r.paid)) > 0) {
      const pr = allRows.filter(r => r.paid > 0 || r.late).sort((a, b) => b.paid - a.paid), mxP = Math.max.apply(null, [1].concat(pr.map(r => r.paid)));
      h += '<div class="panel"><div class="panel-head"><div><div class="panel-title">Royalty paid by pit</div><div class="panel-sub">Total paid to date' + (S.period ? ' · ' + esc(S.period) : '') + '. Not filtered by year or month.</div></div></div>' +
        '<div class="mini-row"><div><b>' + money(paid) + '</b><span>paid to date</span></div><div><b>' + rows.filter(r => r.paid > 0).length + '</b><span>pits paid</span></div><div><b style="color:' + (rows.some(r => r.late) ? C.r : 'var(--ink)') + ';">' + rows.filter(r => r.late).length + '</b><span>overdue</span></div></div>' +
        '<div class="scrollbox">' + pr.map(r => fbar(r.pit.name, r.paid, mxP, C.vm, money(r.paid) + (r.late ? ' · <b style="color:' + C.r + ';">overdue</b>' : ''), r.pit.name + '|Paid ' + money(r.paid) + (r.dueDate ? '|Due ' + G.fmt(r.dueDate) : '') + (r.late ? '|Overdue' : ''), 'pit:' + r.pit.id, pitState(r.pit.id))).join('') + '</div></div>';
    }
    if (S.royaltyAmounts) {
      const topRows = allRows.slice().sort((a, b) => (b.due || 0) - (a.due || 0)), mxD = Math.max.apply(null, [1].concat(topRows.map(r => r.due || 0)));
      h += '<div class="panel"><div class="panel-head"><div><div class="panel-title">Royalties by pit' + illus() + '</div><div class="panel-sub">' + (S.period ? 'Royalty period ' + esc(S.period) + '. ' : '') + 'Not filtered by year or month.</div></div></div>' +
        '<div class="mini-row"><div><b>' + money(due) + '</b><span>total due</span></div><div><b>' + money(paid) + '</b><span>paid</span></div><div><b>' + money(sum(rows.filter(r => r.s.status !== 'Not required').map(r => Math.max(0, r.bal)))) + '</b><span>balance</span></div>' + (rows.some(r => r.held) ? '<div><b>' + rows.filter(r => r.held).length + '</b><span>held for deeds</span></div>' : '<div><b style="color:' + (rows.some(r => r.late) ? C.r : 'var(--ink)') + ';">' + rows.filter(r => r.late).length + '</b><span>overdue</span></div>') + '</div>' +
        '<div class="scrollbox">' + topRows.map(r => fbar(r.pit.name, r.due || 0, mxD, C.vm, (r.due == null ? 'TBD' : money(r.due)) + (r.paid ? ' · ' + money(r.paid) + ' paid' : '') + (r.late ? ' · <b style="color:' + C.r + ';">overdue</b>' : ''),
          r.pit.name + '|' + r.owner + '|Due ' + (r.due == null ? 'TBD' : money(r.due)) + '|Paid ' + money(r.paid) + '|Balance ' + money(Math.max(0, r.bal)) + (r.dueDate ? '|Due ' + G.fmt(r.dueDate) : '') + '|' + (r.late ? 'Overdue' : r.s.status) + (r.held ? ', held for deed' : ''), 'pit:' + r.pit.id, pitState(r.pit.id))).join('') + '</div></div>';
    }
    return h;
  }

  function boot() {
    const r = G.load(window.DEMO);
    if (r.waiting) { G.showWaiting(); return; }
    if (r.error) { G.showError(r.error); return; }
    /* years and like for like come from the Power Apps controls, via the payload */
    const v = S.view || {};
    /* accepts years ("2025,2026" or "all"), or the Dashboard's year + allTime */
    const yv = v.years != null && v.years !== '' ? v.years : v.year;
    const allT = v.allTime === true || String(v.allTime).toLowerCase() === 'true' || String(yv).toLowerCase() === 'all';
    let ys = allT ? S.YEARS.slice()
      : (Array.isArray(yv) ? yv : (yv != null && yv !== '' ? String(yv).split(/[,;\s]+/) : [])).map(Number);
    ys = Array.from(new Set(ys.filter(y => S.YEARS.indexOf(y) >= 0)));
    YSEL = ys.length ? ys : [S.CUR];
    LFL = !!v.lfl;
    G.footer(YSEL.length === S.YEARS.length && YSEL.length > 1 ? 'all time (' + YSEL.join(', ') + ')' : YSEL.join(', '));
    /* a filter that no longer exists in the new data is dropped */
    if (F.pit && !regPits().some(p => p.id === F.pit)) F.pit = null;
    if (F.road && !S.ROADS.some(e => e.road === F.road)) F.road = null;
    render();
  }
  document.addEventListener('click', e => {
    const at = e.target.closest ? e.target.closest('[data-att]') : null;
    if (at) { const k = at.getAttribute('data-att'); ATT = ATT === k ? null : k; render(); return; }
    const el = e.target.closest ? e.target.closest('[data-f]') : null;
    if (!el) return;
    applyF(el.getAttribute('data-f'));
    render();
  });
  window.addEventListener('hashchange', boot);
  G.initTips();
  boot();
})();

</script>
</body>
</html>
